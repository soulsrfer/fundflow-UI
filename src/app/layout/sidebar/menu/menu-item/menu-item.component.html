<ng-container>
    <div *ngIf="root && item.visible !== false" class="layout-menuitem-root-text">{{ item.label }}</div>
    
    <!-- Non-routerLink item OR item with children -->
    <a *ngIf="(!item.routerLink || (item.items && item.items.length > 0)) && item.visible !== false" 
       [attr.href]="item.url" 
       (click)="itemClick($event)" 
       [ngClass]="item.styleClass" 
       [attr.target]="item.target" 
       tabindex="0" 
       pRipple>
        <i [ngClass]="item.icon" class="layout-menuitem-icon"></i>
        <span class="layout-menuitem-text">{{ item.label }}</span>
        <i class="pi pi-fw pi-angle-down layout-submenu-toggler" *ngIf="item.items && item.items.length > 0"></i>
    </a>
    
    <!-- RouterLink without children -->
    <a *ngIf="item.routerLink && !(item.items && item.items.length > 0) && item.visible !== false"
       (click)="itemClick($event)"
       [ngClass]="item.styleClass"
       [routerLink]="item.routerLink"
       routerLinkActive="active-route"
       [routerLinkActiveOptions]="item.routerLinkActiveOptions || { paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
       [fragment]="item.fragment"
       [queryParamsHandling]="item.queryParamsHandling"
       [preserveFragment]="item.preserveFragment"
       [skipLocationChange]="item.skipLocationChange"
       [replaceUrl]="item.replaceUrl"
       [state]="item.state"
       [queryParams]="item.queryParams"
       [attr.target]="item.target"
       tabindex="0"
       pRipple>
        <i [ngClass]="item.icon" class="layout-menuitem-icon"></i>
        <span class="layout-menuitem-text">{{ item.label }}</span>
    </a>

    <!-- Submenu - only render if items exist -->
    <ul *ngIf="item.items && item.items.length > 0 && item.visible !== false" [@children]="submenuAnimation">
        <ng-template ngFor let-child let-i="index" [ngForOf]="item.items">
            <li app-menu-item [item]="child" [index]="i" [parentKey]="key" [class]="child['badgeClass']"></li>
        </ng-template>
    </ul>
</ng-container>
