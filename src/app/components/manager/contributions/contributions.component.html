<div class="card">
  <p-table [value]="contributions" [tableStyle]="{ 'min-width': '60rem' }"
    [paginator]="true" [first]="first" [rows]="rowsPerPage" [totalRecords]="totalRecords"
    [lazy]="true" (onLazyLoad)="loadContributions($event)" [loading]="showLoader"
    [sortField]="defaultSortField" [sortOrder]="defaultSortOrder">
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold">Contributions</span>
        <p-button
          label="Add Contribution"
          icon="pi pi-gift"
          (onClick)="addContribution()"
          raised
        />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>date
          <p-sortIcon field="date"/>
        </th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-contribution>
      <tr>
        <td>{{ contribution.memberName }}</td>
        <td>{{ contribution.amount }}</td>
        <td>{{ contribution.date | date }}</td>
        <td>
          <p-button
            icon="pi pi-pencil"
            class="mr-2"
            severity="secondary"
            outlined
            (onClick)="editContribution(contribution)"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            severity="danger"
            outlined
            (onClick)="confirmDelete(contribution)"
          ></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template #footer>
      In total there are
      {{ totalRecords ? totalRecords : 0 }} contributions.
    </ng-template>
  </p-table>
</div>

<p-drawer
  [header]="!selectedContribution ? 'Add Contribution': 'Edit Contribution' "
  [(visible)]="isDrawerVisible"
  position="right"
  blockScroll="true"
  (onHide)="onHide()"
  [style]="{ width: '25rem' }"
>
  <form [formGroup]="contributionForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2 mt-2 w-full" *ngIf="!selectedContribution">
        <label for="name">Member</label>
        <p-autocomplete
          formControlName="memberId"
          [suggestions]="memberSuggestions"
          (completeMethod)="search($event)"
          [dropdown]="true"
          optionLabel="name"
          optionValue="id"
          [style]="{ width: '100%' }"
          [inputStyle]="{ width: '100%' }"
        />
        <p-message
          *ngIf="
            memberControl?.invalid &&
            (memberControl?.dirty || memberControl?.touched)
          "
          severity="error"
          text="Member is required"
        ></p-message>
      </div>
      <div class="flex flex-col gap-2 mt-2">
        <label for="amount">Amount</label>
        <p-inputnumber
          id="amount"
          formControlName="amount"
          maxlength="10"
          [useGrouping]="false"
        />
        <p-message
          *ngIf="
            amountControl?.invalid &&
            (amountControl?.dirty || amountControl?.touched)
          "
          severity="error"
          text="amount is required"
        ></p-message>
      </div>

      <div class="flex flex-col gap-2 mt-2">
        <label for="date">Date</label>
        <p-datepicker
          formControlName="date"
          [showIcon]="true"
          [iconDisplay]="'input'"
          inputId="date"
          [placeholder]="'Select a date'"
          [dateFormat]="'dd/mm/yy'"
          styleClass="w-full"
        />
        <p-message
          *ngIf="
            dateControl?.invalid && (dateControl?.dirty || dateControl?.touched)
          "
          severity="error"
          text="Date is required"
        ></p-message>
      </div>
    </div>
  </form>

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        (click)="onSubmit()"
        label="Save"
        icon="pi pi-user"
        class="w-full"
        outlined
        [disabled]="contributionForm.invalid"
      ></button>
      <button
        pButton
        label="Cancel"
        icon="pi pi-sign-out"
        class="w-full"
        severity="danger"
        text
        (click)="onHide()"
      ></button>
    </div>
  </ng-template>
</p-drawer>

<p-dialog
  header="Delete Contribution"
  [modal]="true"
  [(visible)]="visibleDialog"
  [style]="{ width: '25rem' }"
>
  <ng-container *ngIf="selectedContribution">
    <span class="p-text-secondary block mb-8"
      >Are you sure, you want to delete this contribution?</span
    >
    <div class="flex items-center gap-4 mb-4">
      <label for="label1" class="font-semibold w-24">Name</label>
      <input
        pInputText
        id="label1"
        class="flex-auto"
        [disabled]="true"
        [(ngModel)]="selectedContribution.memberName"
      />
    </div>
    <div class="flex items-center gap-4 mb-4">
      <label for="role1" class="font-semibold w-24">Amount</label>
      <input
        pInputText
        id="role1"
        class="flex-auto"
        [disabled]="true"
        [(ngModel)]="selectedContribution.amount"
      />
    </div>
    <div class="flex items-center gap-4 mb-4">
      <label for="routerLink1" class="font-semibold w-24">Date</label>
      <input
        pInputText
        id="routerLink1"
        class="flex-auto"
        [disabled]="true"
        [(ngModel)]="selectedContribution.date"
      />
    </div>
    <div class="flex justify-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="onHideDialog()" />
      <p-button label="Confirm" (click)="deleteContribution(selectedContribution.id)" />
    </div>
  </ng-container>
</p-dialog>
